<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Impact Analyzer</title>
  {% if pred %}
  <div class="result">
    <h2>Predicted Engagement: {{ pred }}</h2>
    <p><b>Logos:</b> {{ "%.2f"|format(logos) }}</p>
    <p><b>Pathos:</b> {{ "%.2f"|format(pathos) }}</p>
    <p><b>Ethos:</b> {{ "%.2f"|format(ethos) }}</p>
  </div>
  {% endif %}
</body>
</html>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Speech Impact Analyzer</h1>
  <form method="POST">
    <textarea name="user_input" placeholder="Paste your political speech or tweet here..." required></textarea><br>
    <button type="submit">Analyze</button>
  </form>
