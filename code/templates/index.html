<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Impact Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

  <div class="container">
    <h1>Speech Impact Analyzer</h1>
    <p class="subtitle">Analyze the rhetorical style and predicted engagement of any tweet or political speech.</p>

    <form method="POST" class="analyze-form">
      <textarea name="user_input" placeholder="Paste your text here..." required></textarea>
      <button type="submit">Analyze</button>
    </form>

    {% if pred %}
    <div class="result-card">
      <h2>Predicted Engagement: <span class="engagement">{{ pred }}</span></h2>

      <div class="scores">
        <p><b>Logos:</b> {{ "%.2f"|format(logos) }}</p>
        <p><b>Pathos:</b> {{ "%.2f"|format(pathos) }}</p>
        <p><b>Ethos:</b> {{ "%.2f"|format(ethos) }}</p>
      </div>
    </div>
    {% endif %}
  </div>

</body>
</html>
